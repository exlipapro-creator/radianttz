<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Industrial container port terminal at dusk with cargo ships, gantry cranes and stacked shipping containers">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1a33"/>
      <stop offset="0.45" stop-color="#1c3a66"/>
      <stop offset="0.72" stop-color="#3f6394"/>
      <stop offset="0.86" stop-color="#caa24c"/>
      <stop offset="1" stop-color="#f4d28a"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8b772"/>
      <stop offset="0.12" stop-color="#6f7f9a"/>
      <stop offset="0.5" stop-color="#26405f"/>
      <stop offset="1" stop-color="#0e2238"/>
    </linearGradient>
    <linearGradient id="dock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26333f"/>
      <stop offset="1" stop-color="#161f29"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe7ad" stop-opacity="0.95"/>
      <stop offset="0.4" stop-color="#f6c969" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f6c969" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shipHull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a2230"/>
      <stop offset="1" stop-color="#4a121c"/>
    </linearGradient>
    <linearGradient id="craneMetal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e7edf3"/>
      <stop offset="1" stop-color="#9fb0c2"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="1600" height="560" fill="url(#sky)"/>
  <circle cx="1180" cy="430" r="260" fill="url(#sun)"/>
  <circle cx="1180" cy="445" r="58" fill="#ffe9b8" opacity="0.9"/>

  <!-- Distant haze / far shoreline -->
  <rect x="0" y="498" width="1600" height="44" fill="#34527a" opacity="0.55"/>

  <!-- Far cranes silhouettes -->
  <g fill="#1d3252" opacity="0.7">
    <rect x="120" y="300" width="6" height="220"/>
    <rect x="180" y="300" width="6" height="220"/>
    <rect x="110" y="300" width="120" height="8"/>
    <rect x="225" y="288" width="70" height="6" transform="rotate(-18 225 290)"/>
    <rect x="300" y="320" width="6" height="200"/>
    <rect x="360" y="320" width="6" height="200"/>
    <rect x="294" y="320" width="120" height="8"/>
    <rect x="405" y="308" width="70" height="6" transform="rotate(-18 405 310)"/>
  </g>

  <!-- Water -->
  <rect x="0" y="540" width="1600" height="360" fill="url(#water)"/>
  <!-- Sun glitter on water -->
  <g fill="#ffe6ab" opacity="0.5">
    <rect x="1120" y="560" width="120" height="3"/>
    <rect x="1150" y="575" width="90" height="3"/>
    <rect x="1100" y="592" width="150" height="4"/>
    <rect x="1140" y="612" width="110" height="4"/>
    <rect x="1090" y="640" width="180" height="5"/>
    <rect x="1130" y="675" width="140" height="5"/>
  </g>
  <g fill="#ffffff" opacity="0.06">
    <rect x="0" y="600" width="1600" height="2"/>
    <rect x="0" y="650" width="1600" height="2"/>
    <rect x="0" y="715" width="1600" height="3"/>
    <rect x="0" y="800" width="1600" height="3"/>
  </g>

  <!-- ===== Cargo ship (mid-water) with stacked containers ===== -->
  <g transform="translate(470 470)">
    <!-- hull -->
    <path d="M0 120 L560 120 L520 190 L40 190 Z" fill="url(#shipHull)"/>
    <rect x="0" y="112" width="560" height="12" fill="#2b3744"/>
    <!-- waterline reflection -->
    <path d="M40 190 L520 190 L500 205 L60 205 Z" fill="#1a2c43" opacity="0.6"/>
    <!-- container stacks on deck -->
    <g>
      <!-- row -->
      <g>
        <rect x="30" y="40" width="70" height="72" fill="#d8554a"/>
        <rect x="105" y="40" width="70" height="72" fill="#e6a93c"/>
        <rect x="180" y="40" width="70" height="72" fill="#3f7fb0"/>
        <rect x="255" y="40" width="70" height="72" fill="#4f9d76"/>
        <rect x="330" y="40" width="70" height="72" fill="#d8554a"/>
        <rect x="405" y="40" width="70" height="72" fill="#c9c2b4"/>
        <rect x="480" y="40" width="55" height="72" fill="#3f7fb0"/>
      </g>
      <!-- upper row -->
      <g>
        <rect x="70" y="0" width="64" height="40" fill="#e6a93c"/>
        <rect x="140" y="0" width="64" height="40" fill="#4f9d76"/>
        <rect x="210" y="0" width="64" height="40" fill="#d8554a"/>
        <rect x="280" y="0" width="64" height="40" fill="#3f7fb0"/>
        <rect x="350" y="0" width="64" height="40" fill="#c9c2b4"/>
      </g>
      <!-- container ridge lines -->
      <g stroke="#00000022" stroke-width="2">
        <line x1="30" y1="76" x2="535" y2="76"/>
      </g>
    </g>
    <!-- bridge / superstructure -->
    <rect x="455" y="-40" width="80" height="80" fill="#11212f"/>
    <rect x="468" y="-26" width="54" height="14" fill="#8fb9d6"/>
    <rect x="468" y="-6" width="54" height="14" fill="#8fb9d6"/>
    <rect x="498" y="-78" width="14" height="40" fill="#11212f"/>
  </g>

  <!-- ===== Dock / quay foreground ===== -->
  <rect x="0" y="700" width="1600" height="200" fill="url(#dock)"/>
  <rect x="0" y="700" width="1600" height="10" fill="#3a4b59"/>
  <!-- quay edge stripes -->
  <g fill="#e6b84a" opacity="0.8">
    <rect x="0" y="712" width="120" height="8"/>
    <rect x="180" y="712" width="120" height="8"/>
    <rect x="360" y="712" width="120" height="8"/>
    <rect x="540" y="712" width="120" height="8"/>
    <rect x="720" y="712" width="120" height="8"/>
    <rect x="900" y="712" width="120" height="8"/>
    <rect x="1080" y="712" width="120" height="8"/>
    <rect x="1260" y="712" width="120" height="8"/>
    <rect x="1440" y="712" width="120" height="8"/>
  </g>

  <!-- ===== Two large ship-to-shore gantry cranes ===== -->
  <g>
    <!-- Crane 1 -->
    <g transform="translate(150 0)">
      <!-- legs -->
      <rect x="40" y="250" width="14" height="450" fill="url(#craneMetal)"/>
      <rect x="200" y="250" width="14" height="450" fill="url(#craneMetal)"/>
      <!-- cross bracing -->
      <g stroke="#b9c6d4" stroke-width="6">
        <line x1="47" y1="300" x2="207" y2="380"/>
        <line x1="207" y1="300" x2="47" y2="380"/>
        <line x1="47" y1="430" x2="207" y2="510"/>
        <line x1="207" y1="430" x2="47" y2="510"/>
        <line x1="47" y1="560" x2="207" y2="640"/>
        <line x1="207" y1="560" x2="47" y2="640"/>
      </g>
      <!-- gantry beam top -->
      <rect x="30" y="232" width="194" height="22" fill="#dfe6ee"/>
      <!-- machinery house -->
      <rect x="70" y="200" width="110" height="40" fill="#e6b84a"/>
      <!-- A-frame -->
      <path d="M100 200 L127 150 L154 200 Z" fill="none" stroke="#cdd8e2" stroke-width="8"/>
      <!-- seaward boom (down toward ship) -->
      <rect x="-150" y="236" width="190" height="14" fill="#e6b84a"/>
      <rect x="-150" y="236" width="190" height="14" fill="none" stroke="#c79a36" stroke-width="2"/>
      <!-- landward boom -->
      <rect x="214" y="236" width="120" height="14" fill="#e6b84a"/>
      <!-- trolley + spreader -->
      <rect x="-60" y="250" width="26" height="14" fill="#22303d"/>
      <line x1="-47" y1="264" x2="-47" y2="330" stroke="#1a2630" stroke-width="3"/>
      <rect x="-72" y="330" width="50" height="14" fill="#2b3744"/>
    </g>

    <!-- Crane 2 -->
    <g transform="translate(560 30)">
      <rect x="40" y="250" width="14" height="420" fill="url(#craneMetal)"/>
      <rect x="200" y="250" width="14" height="420" fill="url(#craneMetal)"/>
      <g stroke="#b9c6d4" stroke-width="6">
        <line x1="47" y1="300" x2="207" y2="380"/>
        <line x1="207" y1="300" x2="47" y2="380"/>
        <line x1="47" y1="430" x2="207" y2="510"/>
        <line x1="207" y1="430" x2="47" y2="510"/>
        <line x1="47" y1="560" x2="207" y2="620"/>
        <line x1="207" y1="560" x2="47" y2="620"/>
      </g>
      <rect x="30" y="232" width="194" height="22" fill="#dfe6ee"/>
      <rect x="70" y="200" width="110" height="40" fill="#3f7fb0"/>
      <path d="M100 200 L127 150 L154 200 Z" fill="none" stroke="#cdd8e2" stroke-width="8"/>
      <rect x="-150" y="236" width="190" height="14" fill="#3f7fb0"/>
      <rect x="214" y="236" width="120" height="14" fill="#3f7fb0"/>
      <rect x="-40" y="250" width="26" height="14" fill="#22303d"/>
      <line x1="-27" y1="264" x2="-27" y2="320" stroke="#1a2630" stroke-width="3"/>
      <rect x="-52" y="320" width="50" height="14" fill="#2b3744"/>
    </g>
  </g>

  <!-- ===== Foreground stacked containers on the quay ===== -->
  <g transform="translate(960 540)">
    <!-- back stack -->
    <g>
      <rect x="0" y="0" width="150" height="56" fill="#3f7fb0"/>
      <rect x="152" y="0" width="150" height="56" fill="#d8554a"/>
      <rect x="304" y="0" width="150" height="56" fill="#e6b84a"/>
      <rect x="456" y="0" width="150" height="56" fill="#4f9d76"/>
      <rect x="0" y="58" width="150" height="56" fill="#c9c2b4"/>
      <rect x="152" y="58" width="150" height="56" fill="#4f9d76"/>
      <rect x="304" y="58" width="150" height="56" fill="#3f7fb0"/>
      <rect x="456" y="58" width="150" height="56" fill="#d8554a"/>
    </g>
    <g stroke="#00000026" stroke-width="2">
      <line x1="0" y1="58" x2="606" y2="58"/>
      <line x1="0" y1="116" x2="606" y2="116"/>
    </g>
    <!-- corrugation hints -->
    <g stroke="#ffffff14" stroke-width="2">
      <line x1="20" y1="6" x2="20" y2="50"/><line x1="40" y1="6" x2="40" y2="50"/>
      <line x1="170" y1="6" x2="170" y2="50"/><line x1="190" y1="6" x2="190" y2="50"/>
      <line x1="322" y1="6" x2="322" y2="50"/><line x1="342" y1="6" x2="342" y2="50"/>
      <line x1="474" y1="6" x2="474" y2="50"/><line x1="494" y1="6" x2="494" y2="50"/>
    </g>
  </g>

  <g transform="translate(40 600)">
    <rect x="0" y="0" width="130" height="50" fill="#d8554a"/>
    <rect x="132" y="0" width="130" height="50" fill="#3f7fb0"/>
    <rect x="0" y="52" width="130" height="50" fill="#e6b84a"/>
    <rect x="132" y="52" width="130" height="50" fill="#c9c2b4"/>
    <g stroke="#ffffff14" stroke-width="2">
      <line x1="18" y1="6" x2="18" y2="44"/><line x1="36" y1="6" x2="36" y2="44"/>
      <line x1="150" y1="6" x2="150" y2="44"/><line x1="168" y1="6" x2="168" y2="44"/>
    </g>
  </g>

  <!-- subtle vignette -->
  <rect width="1600" height="900" fill="url(#sky)" opacity="0.05"/>
</svg>
